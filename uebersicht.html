// ---------- Entschlüsseln (Gegenstück zu rmVerpacken in der App) ----------
function bytes(text){ var t = String(text).replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var s = atob(t), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }

var ECDH = { name: 'ECDH', namedCurve: 'P-256' };
async function auspacken(code){
  var roh = bytes(String(code).slice(5));
  if (roh.length < 2 + 65 + 12 + 16 || roh[0] !== 1) throw new Error('FORMAT');
  var kopf = roh.subarray(0, 2), ephRaw = roh.subarray(2, 67), iv = roh.subarray(67, 79), chiffrat = roh.subarray(79);
  var eph = await crypto.subtle.importKey('raw', ephRaw, ECDH, false, []);

  var geheim = await crypto.subtle.deriveBits({ name: 'ECDH', public: eph }, eigen, 256);
  var h = await crypto.subtle.digest('SHA-256', verbinde(new Uint8Array(geheim), ephRaw, new TextEncoder().encode('OGT1/AES-GCM')));
  var aes = await crypto.subtle.importKey('raw', h, { name: 'AES-GCM' }, false, ['decrypt']);
  var daten = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, additionalData: verbinde(kopf, ephRaw) }, aes, chiffrat));
  if (kopf[1] & 1) daten = await strom(daten, new DecompressionStream('deflate'));
  return JSON.parse(new TextDecoder().decode(daten));
}

// ---------- Helfer ----------
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function einheitName(e, plan){ var p = teilSid(e.s), s = plan.sess[p.s]; return (p.w ? 'W' + p.w + ' · ' : '') + (s ? (s.s || s.t) : p.s); }

function saetze(e, plan){
  var out = [];
  Object.keys(e.x || {}).forEach(function(k){
    var ex = plan.ex[k] || { n: k, t: '' }, rows = (e.x[k] || []).filter(Array.isArray), teile = [];
    if (ex.t === 'tick'){
      var n = rows.filter(function(r){ return r[r.length - 1]; }).length;
      if (n) out.push('<li><b>' + esc(ex.n) + ':</b> ' + n + '× erledigt</li>');
      return;
    }
    rows.forEach(function(r){
      if (!r.slice(0, -1).some(function(v){ return v != null; })) return;
      var offen = r[r.length - 1] ? '' : ' (nicht abgehakt)';
      if (ex.t === 'kg') teile.push(zahl(r[0]) + '×' + zahl(r[1]) + offen);

      else teile.push(zahl(r[0]) + ' Wdh.' + offen);

  });

  return out.length ? '<ul>' + out.join('') + '</ul>' : '<span class="leer">keine Sätze eingetragen</span>';

function planKarte(k, d){

      + esc(plan.schmerz) + '</th><th>morgens danach</th><th>' + esc(plan.arm) + '</th><th>Notiz und Sätze</th></tr></thead><tbody>';
    log.forEach(function(e){
      h += '<tr><td class="w">' + fmt(e.d) + '</td><td>' + esc(einheitName(e, plan)) + '</td><td class="w">' + (e.f ? 'fertig ✓' : 'begonnen')
        + '</td><td>' + (e.m != null ? esc(e.m) : '–') + '</td><td>' + wert(e.fr, false) + '</td><td>' + wert(e.e, false) + '</td><td class="w">' + wert(e.k, true)
        + (e.ks ? ' ' + esc(plan.seiten[e.ks] || e.ks) : '') + '</td><td>' + wert(e.o, true) + '</td><td>' + wert(e.sh, true) + '</td><td>'

    h += '<h3>Extra-Trainings</h3><div class="tabelle"><table><thead><tr><th>Datum</th><th>Min</th><th>Was gemacht</th></tr></thead><tbody>'
      + extra.map(function(x){ return '<tr><td class="w">' + fmt(x.d) + '</td><td>' + (x.m != null ? esc(x.m) : '–') + '</td><td class="frei">' + esc(x.n) + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  }
  var tests = Object.keys(d.tests).map(function(i){ return d.tests[i]; });

    h += '<h3>Tests</h3><ul>' + tests.map(function(t){

    }).join('') + '</ul>';
  }

}

// ---------- Handy: einmal freischalten, der Schlüssel bleibt nur auf diesem Gerät ----------
var MERK = 'ogt:uebersicht', FREI_RE = /([A-Za-z0-9_-]{8,})\.([A-Za-z0-9_-]{43})/;   // Leseschlüssel.privater Schlüssel
function merken(text){ var m = FREI_RE.exec(String(text || '')); if (!m) return false; try { localStorage.setItem(MERK, m[1] + '.' + m[2]); return true; } catch (e) { return false; } }

  try { await crypto.subtle.importKey('jwk', PRIVAT, ECDH, false, ['deriveBits']); }

      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d = await r.json(), teil = Array.isArray(d.eintraege) ? d.eintraege : [];
      teil.forEach(function(x){ if (x && typeof x.code === 'string') liste.push({ empfangen: lokal(x.eingang), code: x.code }); seit = Math.max(seit, +x.id || 0); });
      if (teil.length < 500) break;
    }
    var j = new Date();
    return { liste: liste, text: 'live abgerufen um ' + pad(j.getHours()) + ':' + pad(j.getMinutes()) + ' Uhr' };
  } catch (e) {
    return { liste: [], text: 'Live-Abruf nicht möglich (keine Verbindung?) – gezeigt wird der gespeicherte Stand' };
  }
}

async function los(){
  if (!window.crypto || !crypto.subtle){ app.innerHTML = '<div class="sperre">Dieser Browser kann nicht entschlüsseln. Bitte in Chrome oder Edge öffnen.</div>'; return; }
  var live = await liveHolen(), gesehen = {};
  var alle = EINGANG.concat(live.liste).filter(function(x){ if (!x || gesehen[x.code]) return false; gesehen[x.code] = 1; return true; });
  var daten = {}, kaputt = 0, tests = 0, test = '';
  var sortiert = alle.slice().sort(function(a, b){ return (a.empfangen || '') < (b.empfangen || '') ? -1 : 1; });
  for (var i = 0; i < sortiert.length; i++){
    var obj;
    try { obj = await auspacken(sortiert[i].code); } catch (e) { kaputt++; continue; }
    if (!obj || !obj.i) { kaputt++; continue; }
    if (obj.verbindungstest){ tests++; test = sortiert[i].empfangen || test; continue; }   // Testsignal aus verbindungstest.py, ohne Trainingsdaten
    var d = daten[obj.i] || (daten[obj.i] = { log: {}, tests: {}, extra: {}, zuletzt: '' });
    (Array.isArray(obj.l) ? obj.l : []).forEach(function(e){ if (e && e.s){ var b = d.log[e.s]; if (!b || e.t > b.t) d.log[e.s] = e; } });
    (Array.isArray(obj.t) ? obj.t : []).forEach(function(t){ if (t && t.id){ var b = d.tests[t.id]; if (!b || t.t > b.t) d.tests[t.id] = t; } });
    (Array.isArray(obj.extra) ? obj.extra : []).forEach(function(x){ if (x && x.id){ var b = d.extra[x.id]; if (!b || x.t > b.t) d.extra[x.id] = x; } });
    if ((sortiert[i].empfangen || '') > d.zuletzt) d.zuletzt = sortiert[i].empfangen || '';
  }
  document.getElementById('stand').textContent = (live.text ? live.text.charAt(0).toUpperCase() + live.text.slice(1) : 'Stand: ' + (window.OGT_STAND || '–'))
    + ' · ' + (alle.length - tests) + ' Rückmeldung(en)' + (tests ? ' · Verbindungstest ' + fmtZeit(test) + ' ✓' : '');
  // auch Pläne ohne Rückmeldung zeigen, damit sich jeder Plan ansehen lässt
  Object.keys(PLAENE).forEach(function(k){ if (!daten[k]) daten[k] = { log: {}, tests: {}, extra: {}, zuletzt: '' }; });
  var keys = Object.keys(daten).sort(function(a, b){ return daten[a].zuletzt < daten[b].zuletzt ? 1 : (daten[a].zuletzt > daten[b].zuletzt ? -1 : ((PLAENE[a] || {}).titel || a).localeCompare((PLAENE[b] || {}).titel || b)); });
  var h = leiste(keys, daten);
  if (!keys.length) h += '<section class="karte"><h2>Noch keine Rückmeldungen</h2><p>Sobald in der App „Training speichern“ gedrückt wurde, kommt die Einheit hier an – nach dem nächsten Abholen.</p></section>';
  keys.forEach(function(k){ h += planKarte(k, daten[k]); });
  if (kaputt) h += '<p class="klein">' + kaputt + ' Rückmeldung(en) konnten nicht gelesen werden (anderer Schlüssel oder beschädigt).</p>';
  h += HANDY ? handyFuss() : pcHandyKarte();
  app.innerHTML = h;
  leisteKnoepfe();
  if (HANDY) handyKnoepfe();
  document.body.setAttribute('data-fertig', '1');
}
function fehlerZeigen(e){ app.innerHTML = '<div class="sperre">Fehler beim Entschlüsseln: ' + esc(e && e.message) + '</div>'; }
if (HANDY){
  document.getElementById('fuss').textContent = 'Der Schlüssel liegt nur auf diesem Handy – die Bildschirmsperre schützt ihn. Die Werte sind Eigenangaben: Hinweise, keine Diagnose.';
  handyLaden().then(function(ok){ if (ok) return los(); }).catch(fehlerZeigen);
} else los().catch(fehlerZeigen);
})();
